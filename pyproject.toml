[project]
name = "loops"
version = "0.1.0"
description = "Private search and Q&A over your Gmail and Telegram, on open models."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "sse-starlette>=2.1",
    "telethon>=1.36",
    "python-telegram-bot>=21",
    "apscheduler>=3.10,<4",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
loops = "loops.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loops*"]

[tool.setuptools.package-data]
loops = ["extract/prompts/*.txt", "db/migrations/*.mako"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "live: hits the real Nebius Token Factory API (needs NEBIUS_API_KEY)",
    "db: needs a Postgres with pgvector (TEST_DATABASE_URL)",
]
